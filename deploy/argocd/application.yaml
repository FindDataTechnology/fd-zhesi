# ArgoCD Application — fd-zhesi-web（cheap 集群 fd-prod）。
# fd-wire 同法：Application 放在同步路径（deploy/k8s）之外避免自引用；
# GitOps 只管工作负载清单；Secret 集群内手工创建不入 git。
# 前置：argocd ns 已建 repo 凭据 secret（repo-fd-zhesi-web）+ app secret
#（fd-zhesi-env），否则首同步 ImagePullBackOff / CreateContainerConfigError。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fd-zhesi-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitee.com/FindDataTechnology/fd-zhesi-web.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
