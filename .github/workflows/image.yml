# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# fd-zhesi 单仓双镜像：web（前端静态面）/ api（FastAPI 服务端）。
# Standard channel per openspec zhesi-worldview-workshop / docs/IMAGE-RELEASE.md.
name: image

# 2026-11-09 按 image-quota-allocation R2 停用私有仓自动出片：出片由公开镜像仓
# 本源仓自己承担（公开仓标准 runner 免费无限）。
# 本仓 CI 因组织私有额度耗尽而全部瞬时失败，无产出。保留手动入口以便回滚。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/checkout@v4
        with:
          repository: FindDataTechnology/fd-zhesi-reference
          path: fd-zhesi-reference

      - name: Install
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ../fd-zhesi-reference
          pip install -e ".[dev]"

      - name: Test suite
        working-directory: server
        run: python -m pytest tests/ -q

  fd-zhesi-web:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-zhesi-web
      namespace: finddata-business

  fd-zhesi-api:
    needs: api-test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-zhesi-api
      namespace: finddata-business
